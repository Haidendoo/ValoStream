name: Event contracts

on:
  pull_request:
    paths:
      - 'schemas/**'
      - 'producer/**'
      - 'flink/pyflink/**'
      - 'deploy/**'
      - 'tests/**'
      - '.github/workflows/event-contracts.yml'
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: producer/requirements.txt
      - run: python -m pip install -r producer/requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check schema syntax
        run: python -m producer.schema_registry check
      - name: Check evolution against PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          base = os.environ['BASE_SHA']
          with tempfile.TemporaryDirectory() as directory:
              files = subprocess.check_output(
                  ['git', 'ls-tree', '-r', '--name-only', base, '--', 'schemas/'], text=True
              ).splitlines()
              for name in files:
                  if name.endswith('.avsc'):
                      if not Path(name).is_file():
                          raise SystemExit(f'Existing contract removed: {name}')
                      content = subprocess.check_output(['git', 'show', f'{base}:{name}'])
                      (Path(directory) / Path(name).name).write_bytes(content)
              subprocess.run([
                  'python', '-m', 'producer.schema_registry', 'check',
                  '--baseline-dir', directory,
              ], check=True)
          PY
      - name: Validate deployment configuration
        run: docker compose -f deploy/docker-compose.yml config --quiet
