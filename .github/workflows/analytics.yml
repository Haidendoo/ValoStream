name: Analytics quality gate

on:
  pull_request:
    paths:
      - 'analytics/**'
      - 'ops/*analytics*.py'
      - 'ops/nessie_quality_gate.py'
      - 'schemas/**'
      - 'flink/pyflink/**'
      - 'tests/analytics/**'
      - 'deploy/docker-compose*.yml'
      - '.github/workflows/analytics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            analytics/requirements.txt
            analytics/requirements-integration.txt
      - run: python -m pip install -r analytics/requirements-integration.txt
      - run: python -m unittest discover -s tests/analytics -v
      - run: dbt parse --project-dir analytics --profiles-dir analytics
      - name: Start StarRocks, Nessie, and MinIO
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.analytics-ci.yml up -d --wait starrocks
      - name: Verify marts and rejection of corrupt fixtures
        run: python -m ops.check_analytics
      - name: Verify branch-scoped Iceberg sources and cleanup
        run: PYTHONPATH=. python tests/analytics/nessie_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytics-results
          path: |
            analytics/target/fixture-check/**/run_results.json
            analytics/target/fixture-check/**/logs/dbt.log
            analytics/target/nessie-smoke/run_results.json
            analytics/target/nessie-smoke/logs/dbt.log
      - name: Stop test service
        if: always()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.analytics-ci.yml down
