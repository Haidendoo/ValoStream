services:
  # 1. Object Storage
  minio:
    image: quay.io/minio/minio:latest
    container_name: valostream-minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 5

  # 2. Apache Nessie Iceberg REST Catalog
  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    container_name: valostream-nessie
    ports:
      - "19120:19120"
    environment:
      - NESSIE_VERSION_STORE_TYPE=IN_MEMORY
      - NESSIE_CATALOG_DEFAULT_WAREHOUSE=warehouse
      - NESSIE_CATALOG_WAREHOUSES_WAREHOUSE_LOCATION=s3://warehouse/
      - NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ENDPOINT=http://valostream-minio:9000
      - NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_PATH_STYLE_ACCESS=true
      - NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_REGION=us-east-1
      - JAVA_TOOL_OPTIONS=-Dnessie.catalog.service.s3.default-options.auth-type=STATIC -Dnessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:s3secret -Ds3secret.name=admin -Ds3secret.secret=password123
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:19120/api/v2/config || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 5

  # 3. Apache Kafka (KRaft Mode)
  kafka:
    image: apache/kafka:latest
    container_name: valostream-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://valostream-kafka:29092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@valostream-kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-cluster.sh", "cluster-id", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 4. Apache Flink JobManager
  flink-jobmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    image: valostream-flink:1.18-pyflink
    container_name: valostream-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=valostream-flink-jobmanager
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: valostream-flink-jobmanager
        parallelism.default: 2
        execution.checkpointing.interval: 30s
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - ../flink/lib/flink-sql-connector-kafka-3.1.0-1.18.jar:/opt/flink/lib/flink-sql-connector-kafka-3.1.0-1.18.jar
      - ../flink/lib/iceberg-flink-runtime-1.18-1.5.2.jar:/opt/flink/lib/iceberg-flink-runtime-1.18-1.5.2.jar
      - ../flink/lib/iceberg-aws-bundle-1.5.2.jar:/opt/flink/lib/iceberg-aws-bundle-1.5.2.jar
      - ../flink/lib/h3-3.7.3.jar:/opt/flink/lib/h3-3.7.3.jar
      - ../flink/lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:/opt/flink/lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar
      - ../flink/lib/sedona-flink-shaded_2.12-1.6.1.jar:/opt/flink/lib/sedona-flink-shaded_2.12-1.6.1.jar
      - ../flink/lib/geotools-wrapper-1.6.1-28.2.jar:/opt/flink/lib/geotools-wrapper-1.6.1-28.2.jar
      - ../flink/lib/fluss-flink-1.18-0.9.1-incubating.jar:/opt/flink/lib/fluss-flink-1.18-0.9.1-incubating.jar
      - ../flink/pyflink:/opt/flink/pyflink
    depends_on:
      - kafka
      - nessie
      - minio

  # 5. Apache Flink TaskManager
  flink-taskmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    image: valostream-flink:1.18-pyflink
    container_name: valostream-flink-taskmanager
    command: taskmanager
    environment:
      - JOB_MANAGER_RPC_ADDRESS=valostream-flink-jobmanager
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: valostream-flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - ../flink/lib/flink-sql-connector-kafka-3.1.0-1.18.jar:/opt/flink/lib/flink-sql-connector-kafka-3.1.0-1.18.jar
      - ../flink/lib/iceberg-flink-runtime-1.18-1.5.2.jar:/opt/flink/lib/iceberg-flink-runtime-1.18-1.5.2.jar
      - ../flink/lib/iceberg-aws-bundle-1.5.2.jar:/opt/flink/lib/iceberg-aws-bundle-1.5.2.jar
      - ../flink/lib/h3-3.7.3.jar:/opt/flink/lib/h3-3.7.3.jar
      - ../flink/lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar:/opt/flink/lib/flink-shaded-hadoop-2-uber-2.8.3-10.0.jar
      - ../flink/lib/sedona-flink-shaded_2.12-1.6.1.jar:/opt/flink/lib/sedona-flink-shaded_2.12-1.6.1.jar
      - ../flink/lib/geotools-wrapper-1.6.1-28.2.jar:/opt/flink/lib/geotools-wrapper-1.6.1-28.2.jar
      - ../flink/lib/fluss-flink-1.18-0.9.1-incubating.jar:/opt/flink/lib/fluss-flink-1.18-0.9.1-incubating.jar
      - ../flink/pyflink:/opt/flink/pyflink
    depends_on:
      - flink-jobmanager

  # 6. StarRocks Vectorized OLAP Engine
  starrocks:
    image: starrocks/allin1-ubuntu:latest
    container_name: valostream-starrocks
    ports:
      - "9030:9030" # MySQL Protocol
      - "8030:8030" # FE Web
      - "8040:8040" # BE Web
    depends_on:
      nessie:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -P 9030 -u root -e 'SELECT 1;' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  # 7. Online Feature Store (Redis)
  redis:
    image: redis:latest
    container_name: valostream-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  # 8. Vector Database (Qdrant)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: valostream-qdrant
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC API
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 9. ZooKeeper (for Apache Fluss metadata)
  zookeeper:
    image: zookeeper:3.9.2
    container_name: valostream-zookeeper
    restart: always
    ports:
      - "2181:2181"

  # 10. Apache Fluss Coordinator Server
  coordinator-server:
    image: apache/fluss:0.9.1-incubating
    container_name: valostream-fluss-coordinator
    command: coordinatorServer
    depends_on:
      - zookeeper
    environment:
      - |
        FLUSS_PROPERTIES=
        zookeeper.address: zookeeper:2181
        bind.listeners: INTERNAL://coordinator-server:0, CLIENT://coordinator-server:9123
        advertised.listeners: CLIENT://coordinator-server:9123
        internal.listener.name: INTERNAL
        remote.data.dir: /tmp/fluss/remote-data
    ports:
      - "9123:9123"

  # 11. Apache Fluss Tablet Server 0
  tablet-server-0:
    image: apache/fluss:0.9.1-incubating
    container_name: valostream-fluss-tablet-0
    command: tabletServer
    depends_on:
      - coordinator-server
    environment:
      - |
        FLUSS_PROPERTIES=
        zookeeper.address: zookeeper:2181
        bind.listeners: INTERNAL://tablet-server-0:0, CLIENT://tablet-server-0:9123
        advertised.listeners: CLIENT://tablet-server-0:9123
        internal.listener.name: INTERNAL
        tablet-server.id: 0
        kv.snapshot.interval: 0s
        data.dir: /tmp/fluss/data/tablet-server-0
        remote.data.dir: /tmp/fluss/remote-data
    ports:
      - "9124:9123"
    volumes:
      - shared-tmpfs:/tmp/fluss

  # 12. Apache Fluss Tablet Server 1
  tablet-server-1:
    image: apache/fluss:0.9.1-incubating
    container_name: valostream-fluss-tablet-1
    command: tabletServer
    depends_on:
      - coordinator-server
    environment:
      - |
        FLUSS_PROPERTIES=
        zookeeper.address: zookeeper:2181
        bind.listeners: INTERNAL://tablet-server-1:0, CLIENT://tablet-server-1:9123
        advertised.listeners: CLIENT://tablet-server-1:9123
        internal.listener.name: INTERNAL
        tablet-server.id: 1
        kv.snapshot.interval: 0s
        data.dir: /tmp/fluss/data/tablet-server-1
        remote.data.dir: /tmp/fluss/remote-data
    ports:
      - "9125:9123"
    volumes:
      - shared-tmpfs:/tmp/fluss

  # 13. Apache Fluss Tablet Server 2
  tablet-server-2:
    image: apache/fluss:0.9.1-incubating
    container_name: valostream-fluss-tablet-2
    command: tabletServer
    depends_on:
      - coordinator-server
    environment:
      - |
        FLUSS_PROPERTIES=
        zookeeper.address: zookeeper:2181
        bind.listeners: INTERNAL://tablet-server-2:0, CLIENT://tablet-server-2:9123
        advertised.listeners: CLIENT://tablet-server-2:9123
        internal.listener.name: INTERNAL
        tablet-server.id: 2
        kv.snapshot.interval: 0s
        data.dir: /tmp/fluss/data/tablet-server-2
        remote.data.dir: /tmp/fluss/remote-data
    ports:
      - "9126:9123"
    volumes:
      - shared-tmpfs:/tmp/fluss

  # ── Observability Stack ──────────────────────────────────────────────────

  # 14. Prometheus Metrics Server
  prometheus:
    image: prom/prometheus:latest
    container_name: valostream-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 15. Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: valostream-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=valostream
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  shared-tmpfs:
    driver: local
    driver_opts:
      type: "tmpfs"
      device: "tmpfs"
