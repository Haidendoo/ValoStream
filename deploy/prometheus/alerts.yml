groups:
  - name: statistical-quality
    rules:
      - alert: StatisticalQualityReportUnavailable
        expr: valostream_quality_report_valid{job="serving-api"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Daily volume report is missing or invalid
      - alert: StatisticalQualityCheckFailed
        expr: valostream_quality_healthy{job="serving-api"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Daily volume check found an anomaly, insufficient baseline, or run failure
      - alert: StatisticalQualityCheckOverdue
        expr: time() - valostream_quality_window_end_timestamp_seconds{job="serving-api"} > 108000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Daily volume monitor has not checked a recent completed day
  - name: serving-releases
    rules:
      - alert: ServingAPIUnavailable
        expr: up{job="serving-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Serving API metrics endpoint is unavailable
      - alert: ServingReleaseManifestUnavailable
        expr: valostream_release_manifest_valid{job="serving-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Serving release manifest is missing or invalid
      - alert: ServingReleaseFreshnessFailed
        expr: valostream_release_freshness_healthy{job="serving-api"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Serving release failed its configured freshness checks
